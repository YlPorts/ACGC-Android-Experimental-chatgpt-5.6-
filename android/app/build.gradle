plugins {
    id "com.android.application"
}

def stableKeystorePath = System.getenv("ACGC_KEYSTORE_PATH")
def stableKeystorePassword = System.getenv("ACGC_KEYSTORE_PASSWORD")

android {
    namespace "com.acgc.port"
    compileSdk 34

    signingConfigs {
        stable {
            if (stableKeystorePath && stableKeystorePassword) {
                storeFile file(stableKeystorePath)
                storePassword stableKeystorePassword
                keyAlias "acgc-public"
                keyPassword stableKeystorePassword
                storeType "PKCS12"
            }
        }
    }

    defaultConfig {
        applicationId "com.acgc.port"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "4"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            if (stableKeystorePath && stableKeystorePassword) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["../SDL/android-project/app/src/main/java"]
            assets.srcDirs += ["../../pc/shaders"]
        }
    }

    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
