name: Build Android 32-bit Folder Edition

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pc/**"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android-32.yml"

permissions:
  contents: read

jobs:
  apk-32:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SDL2 when the source archive has no gitlink
        run: |
          if [ ! -f android/SDL/CMakeLists.txt ]; then
            rm -rf android/SDL
            git clone --depth 1 --branch release-2.30.11 \
              https://github.com/libsdl-org/SDL.git android/SDL
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare stable signing key
        env:
          ACGC_SIGNING_KEY: ${{ secrets.ACGC_SIGNING_KEY }}
          ACGC_SIGNING_PASSWORD: ${{ secrets.ACGC_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ACGC_SIGNING_KEY" ] && [ -n "$ACGC_SIGNING_PASSWORD" ]; then
            printf '%s' "$ACGC_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/acgc-signing.p12"
            echo "ACGC_KEYSTORE_PATH=$RUNNER_TEMP/acgc-signing.p12" >> "$GITHUB_ENV"
            echo "ACGC_KEYSTORE_PASSWORD=$ACGC_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build 32-bit debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify ABI and APK signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="$RUNNER_TEMP/acgc-apk-check"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" "lib/*" -d "$CHECK_DIR"

          test -f "$CHECK_DIR/lib/armeabi-v7a/libmain.so"
          UNEXPECTED_ABIS="$(find "$CHECK_DIR/lib" -mindepth 1 -maxdepth 1 -type d ! -name armeabi-v7a -print)"
          test -z "$UNEXPECTED_ABIS"
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Machine:[[:space:]]+ARM'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            Animal-Crossing-Android-32bit-FolderEdition.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animal-Crossing-Android-32bit-FolderEdition
          path: Animal-Crossing-Android-32bit-FolderEdition.apk
          if-no-files-found: error
